name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build --release -p whisper-cli

      - name: Test examples
        run: |
          ./target/release/whisper run docs/examples/hello.ws
          ./target/release/whisper run docs/examples/sum.ws
          ./target/release/whisper run docs/examples/factorial.ws

      - name: Stdlib smoke (import + keyword-named defs)
        run: |
          printf 'import "std/math"\npi floor .' > /tmp/sm1.ws
          ./target/release/whisper run /tmp/sm1.ws
          printf 'import "std/list"\n[1 2 3 4 5] { _ * } @map sum .' > /tmp/sm2.ws
          ./target/release/whisper run /tmp/sm2.ws
          printf 'import "std/str"\n"hello" strlen .' > /tmp/sm3.ws
          ./target/release/whisper run /tmp/sm3.ws

      - name: Hard self-hosting smoke
        run: |
          printf '2 3 + .' > /tmp/bt.ws
          ./target/release/whisper bootstrap --hard /tmp/bt.ws

  c-backend:
    name: C transpiler end-to-end (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run C backend tests
        run: cargo test -p whisper-codegen --test c_backend_tests -- --nocapture

  selfhost:
    name: Self-hosting chain (C seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build seed compiler
        run: gcc -O2 -o whisper0 whisperc/seed/compiler_seed.c -lm
      - name: Core tests (interpreter mode)
        run: bash whisper_test/run_core.sh ./whisper0 run
      - name: Core tests (C-emission mode)
        run: bash whisper_test/run_core.sh ./whisper0 c
      - name: Verify self-hosting fixed point
        run: bash scripts/verify-fixedpoint.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --all --check

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p whisper-cli
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/whisper
          generate_release_notes: true
