name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build --release -p whisper-cli

      - name: Test examples
        run: |
          ./target/release/whisper run docs/examples/hello.ws
          ./target/release/whisper run docs/examples/sum.ws
          ./target/release/whisper run docs/examples/factorial.ws

      - name: Stdlib smoke (import + keyword-named defs)
        run: |
          printf 'import "std/math"\npi floor .' > /tmp/sm1.ws
          ./target/release/whisper run /tmp/sm1.ws
          printf 'import "std/list"\n[1 2 3 4 5] { _ * } @map sum .' > /tmp/sm2.ws
          ./target/release/whisper run /tmp/sm2.ws
          printf 'import "std/str"\n"hello" strlen .' > /tmp/sm3.ws
          ./target/release/whisper run /tmp/sm3.ws

      - name: Self-hosted compiler smoke (bootstrap == c2)
        run: |
          printf '2 3 + .' > /tmp/bt.ws
          ./target/release/whisper bootstrap /tmp/bt.ws > /tmp/bt_bootstrap.c
          ./target/release/whisper build -t c2 -o /tmp/bt_c2 /tmp/bt.ws
          # The two must be the same pipeline — compare the generated C, not
          # just the exit code (the deleted second compiler also exited 0).
          cmp /tmp/bt_bootstrap.c /tmp/bt_c2.c

      - name: Word-table parity (Rust front end vs self-hosted table)
        run: bash tools/word-table-parity.sh

  c-backend:
    name: C transpiler end-to-end (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run C backend tests
        run: cargo test -p whisper-codegen --test c_backend_tests -- --nocapture

  # Compiler matrix (independence Step 6): C is meant to be a *substitutable*
  # portable assembly, so the emitted C must not lean on one compiler's
  # extensions or on non-default flags. clang is the second leg — it rejects
  # different things than gcc and is where a stray GCC-ism surfaces.
  # The runtime no longer needs -fno-strict-aliasing (removed 2026-09-21:
  # byte-identical output with and without it on the heaviest workload, and
  # the aliasing audit is clean), so this leg also guards that assumption.
  c-backend-clang:
    name: C backend (clang leg)
    runs-on: ubuntu-latest
    env:
      # c2/native honour WHISPER_CC; the shell gates compile emitted C
      # themselves and read GCC. Both must point at clang for this leg.
      WHISPER_CC: clang
      GCC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: C backend tests under clang
        run: cargo test -p whisper-codegen --test c_backend_tests -- --nocapture
      - name: c2 chain under clang
        run: |
          cargo build -p whisper-cli
          bash scripts/stdlib-gate.sh
      - name: Opcode coverage gate under clang
        run: bash tools/opcode_coverage.sh ./target/debug/whisper

  selfhost:
    name: Self-hosting chain (C seed)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build seed compiler
        run: gcc -O2 -o whisper0 whisperc/seed/compiler_seed.c -lm
      - name: Seed startup diagnostics
        run: |
          set +e
          echo '42 .' | ./whisper0 >/tmp/seed.out 2>/tmp/seed.err
          rc=$?
          echo "seed rc=$rc"
          echo "--- seed stderr ---"
          cat /tmp/seed.err
          echo "--- seed stdout (head) ---"
          head -5 /tmp/seed.out
      - name: Core tests (seed C-emission mode)
        run: bash whisper_test/run_core.sh ./whisper0 c
      - name: Verify self-hosting fixed point
        run: bash scripts/verify-fixedpoint.sh
      - name: Stdlib gate (self-hosted c2 chain)
        run: |
          cargo build -p whisper-cli
          bash scripts/stdlib-gate.sh
      - name: Opcode coverage gate (VM vs self-hosted C chain, per-feature dual-run)
        run: bash tools/opcode_coverage.sh ./target/debug/whisper
      - name: Typecheck FP-ratchet gate (encoding/conformance; lexicon skipped on CI)
        run: bash scripts/typecheck-gate.sh ./target/debug/whisper
      - name: Syntax freeze gate (dual-implementation conformance)
        run: bash scripts/syntax-gate.sh
      - name: Net gate (real HTTP server via self-hosted chain)
        run: bash scripts/net-gate.sh
      - name: "App gate (Whisper web backend: JSON/static/404 routes)"
        run: bash scripts/app-gate.sh

  wd-build:
    name: wd build (CI fast) + formatter
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI (C emission for the test-tool fast path)
        run: cargo build -p whisper-cli
      - name: Build wd via bootstrap C (test tool only)
        run: bash scripts/build-wd.sh --fast
      - name: wd cache gate
        run: bash scripts/wd-cache-gate.sh
      - name: wd c gate
        run: bash scripts/wd-c-gate.sh
      - name: Build wfmt
        run: bash scripts/build-wfmt.sh
      - name: fmt gate
        run: bash scripts/fmt-gate.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --all --check

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, wd-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p whisper-cli
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            target/release/whisper
            docs/release-notes.md
            docs/wasm-v1-release.md
      - name: Sync release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
